# Build MCUboot as the bootloader (dual-slot, signed images) alongside the app.
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Production image-signing key. PUBLIC half is compiled into MCUboot; PRIVATE
# half signs each image. Absolute path, deliberately outside the repo.
# Losing this file means no deployed device will ever accept another OTA.
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="D:/Z_CONTROLLER_DATA/7.NRF54L15/FIRST_TRIAL/keys/sw_signing_key.pem"

