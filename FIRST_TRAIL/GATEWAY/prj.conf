# --- BLE: observe sensor nodes + central (relay OTA to nodes) + peripheral
#         (field-service SMP DFU of the gateway itself) ---
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y

# --- MCUboot dual-slot firmware update (gateway self-OTA via cellular) ---
CONFIG_BOOTLOADER_MCUBOOT=y

# --- SMP over BLE (MCUmgr): field-service DFU of the gateway ---
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
# (OS-group reset ships with MCUMGR_GRP_OS in current NCS; the old
#  MCUMGR_GRP_OS_RESET symbol was removed.)
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
# For relaying an image to a sub-node, add the MCUmgr image-upload CLIENT
# (NCS): CONFIG_MCUMGR_GRP_IMG_CLIENT=y + CONFIG_SMP_CLIENT=y  (see node_dfu.c)

# --- UARTs: LC29H GPS + EC200 modem (interrupt-driven) ---
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y             # gnss.c / ec200.c ISR<->thread byte FIFOs

# --- GPIO (BMA400 impact-wake INT on P1.16) ---
CONFIG_GPIO=y

# --- I2C for BMA400 + SHT40 (SDA=P1.04, SCL=P1.05) ---
CONFIG_I2C=y

# --- Memory: NOR (store-and-forward) + FRAM (pointers) on SPI (P2) ---
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_SPI_NOR=y
# Runtime SFDP: the driver reads the NOR's parameter table from the chip at boot
# (no 'sfdp-bfp' devicetree blob needed). Switch back to SFDP_DEVICETREE only if
# you add the W25Q128 sfdp-bfp + jedec-id to the node to shave the boot read.
CONFIG_SPI_NOR_SFDP_RUNTIME=y
CONFIG_EEPROM=y
CONFIG_EEPROM_AT25=y              # generic SPI FRAM/EEPROM (verify part)
CONFIG_CBPRINTF_FP_SUPPORT=y      # (already set) for %f in payloads

# --- Console is repinned to the debug header on P1.02/P1.03 (NFC pins).
#     Schematic confirms D_TX = P1.02/NFC1 and D_RX = P1.03/NFC2, so the NFC
#     function MUST be released or the console is dead.
#     On the nRF54L15 that is NOT a Kconfig: CONFIG_NFCT_PINS_AS_GPIOS is an
#     nRF52/nRF53-only symbol and assigning it here is a fatal Kconfig warning.
#     The nRF54L equivalent is a UICR devicetree property - see
#     "&uicr { nfct-pins-as-gpios; }" in app.overlay. ---

# --- events + float printf for the JSON payload ---
CONFIG_EVENTS=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_FPU=y
CONFIG_PICOLIBC=y

CONFIG_MAIN_STACK_SIZE=6144
CONFIG_HEAP_MEM_POOL_SIZE=4096

# sys_reboot() for the reboot command / OTA apply
CONFIG_REBOOT=y
CONFIG_POWEROFF=y                 # sys_poweroff() -> System OFF (deepest)

# --- OTA / DFU: stream the HTTP-downloaded image into MCUboot's slot-1 ---
# Requires MCUboot as the bootloader (enable in sysbuild: SB_CONFIG_BOOTLOADER_MCUBOOT=y)
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y  # erase slot-1 as we write, not all up front
CONFIG_DFU_TARGET=y
CONFIG_DFU_TARGET_MCUBOOT=y
CONFIG_DFU_TARGET_STREAM=y

# =========================================================================
#  POWER MANAGEMENT (6-year battery target)
# =========================================================================
# Tickless kernel (default on) + PM => the idle thread automatically puts the
# SoC into System ON idle (CPU asleep, RADIO/GRTC/GPIO alive) whenever every
# thread is blocked. The BLE controller keeps scanning in hardware and wakes
# the CPU only for radio events, so BLE interrupts KEEP WORKING while idle.
# System OFF is NOT entered automatically here (it would kill the radio); it is
# used explicitly via sys_poweroff() only when a GPIO is the sole wake source.
# NOTE: CONFIG_PM (system PM) is unavailable on the nRF54L15 in NCS v3.4.0 -
# only the nRF54H/nRF92 families "select HAS_PM", so this assignment is dropped
# and raises a fatal Kconfig warning. No behaviour is lost: the tickless kernel
# already enters System ON idle whenever every thread blocks, and sys_poweroff()
# still reaches System OFF explicitly.
# ---- device power management (RDSO s5.1.20, 6-year life) ----
#
# Both of these were switched OFF while the modem transport was being debugged,
# on the theory that a suspended UARTE was eating the AT replies. That theory
# was wrong: the real fault was in app.overlay, which redefined uart22_default
# with TX and RX swapped and so overrode the corrected board pinctrl. With the
# pins right the modem answers, and there is no longer any reason to run the
# board with power management disabled.
#
# PM_DEVICE alone is passive - nothing suspends unless the application asks it
# to. It buys back the NOR deep-power-down in power.c (mem_power_off()), worth
# ~1 uA of the standing budget.
CONFIG_PM_DEVICE=y

# PM_DEVICE_RUNTIME is the active one: an idle peripheral is auto-suspended,
# and a suspended UARTE applies its `sleep` pinctrl, which carries
# low-power-enable and DISCONNECTS the pins. That is safe here ONLY because
# power.c now holds a runtime-PM reference across each modem/GNSS session -
# see uart_pm_get()/uart_pm_put() there. The reference is taken beside the
# board_out() that raises the rail and dropped beside the one that cuts it, so
# the UART is resumed for exactly as long as the module it talks to has power.
#
# Runtime PM is opted into per device, in power_init(), for uart22 (modem) and
# uart30 (GNSS) only. The console uart20 is deliberately left alone: suspending
# it would drop debug output, and it is not on the switched rail anyway.
CONFIG_PM_DEVICE_RUNTIME=y

# BMA400 impact line must be able to wake even from System OFF (GPIO SENSE).
CONFIG_GPIO=y

# Reset-cause reporting at boot. Brownout, watchdog and software reset demand
# different responses and are otherwise indistinguishable on the console.
CONFIG_HWINFO=y

# Keep the console quiet/deferred so logging never blocks or wakes the CPU.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
# Deferred logging hands messages to a worker thread through a fixed buffer.
# Early boot produces them far faster than a 115200 console can drain, so the
# default 1 KB overflows and the subsystem prints "--- N messages dropped ---".
# Nothing is wrong when that appears - it is the log subsystem being honest -
# but the dropped lines are exactly the driver init messages worth reading.
CONFIG_LOG_BUFFER_SIZE=8192

# =========================================================================
#  PSA CRYPTO - decrypt/authenticate the encrypted BLE sensor adverts
# =========================================================================
# AES-CCM (advert payload) + HKDF-SHA256 (per-wagon key from the wagon number).
# nRF Security selects the CRACEN/Oberon PSA backend on the nRF54L15.
#
# NOTE: do NOT set CONFIG_NRF_SECURITY. As of NCS v3.4.0 it is a promptless
# "def_bool y" enabled automatically via PSA_CRYPTO_PROVIDER_CUSTOM (the default
# provider on Nordic ARM SoCs); assigning it is a hard Kconfig error. The
# PSA_WANT_* symbols below are the real knobs.
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_KEY_TYPE_DERIVE=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_ALG_HKDF=y
CONFIG_PSA_WANT_ALG_HMAC=y      # HKDF depends on HMAC - required or HKDF is silently off
CONFIG_PSA_WANT_ALG_SHA_256=y

# --- Internal WDT31: the gateway has no external watchdog (sub-nodes have a
#     TPL5010). See src/watchdog.c for the liveness gate. ---
CONFIG_WATCHDOG=y

# --- BLE central + GATT client: deliver queued config to sub-nodes ---
CONFIG_BT_GATT_CLIENT=y

# --- Settings/NVS: node_link persists the per-node downlink counters here.
#     They MUST survive a gateway reboot: re-emitting a counter the node has
#     already accepted would be rejected as a replay, silently wedging that
#     node's config channel. (Gateway app config still lives in FRAM.) ---
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y

# ---- ATT MTU for the sub-node image transfer -----------------------------
# One sealed image frame (struct sw_img_enc) is 215 B: a 192-byte chunk plus
# the addressing header, the ct_len and the 4-byte MIC. An ATT write request
# adds 3 B, so the link needs an MTU of at least 218 or the write is rejected
# outright and no image can ever move.
#
# These were removed when sub-node OTA was dropped, and had to come back with
# it. 247 leaves headroom without paying for a second ACL buffer size class.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251

# On-die temperature sensor - RDSO s5.1.10 requires the gateway to be able
# to halt transmissions on an internal temperature reading. See thermal.c.
CONFIG_SENSOR=y
CONFIG_TEMP_NRF5=y

# ---- BLE output power ----------------------------------------------------
# Default is 0 dBm; the nRF54L15 supports +8 dBm. This governs the gateway's
# TRANSMIT side only - the connectable config window that carries threshold and
# OTA frames down to a node. Node adverts reaching the gateway are governed by
# the node's own setting.
#
# The power cost is far easier to justify here than on a node: the gateway runs
# from a solar-fed rechargeable LTO pack, not a primary cell with a six-year
# budget.
CONFIG_BT_CTLR_TX_PWR_ANTENNA=8
